<!-- Страница «Спасибо» после анкеты предзаписи. Одна на оба сайта (предзапись и лид-магнит).
     Вставить целиком в HTML-блок GetCourse. Ссылку на закрытый канал поставить в href у кнопки (сейчас там #). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:only light}
  html{color-scheme:only light;background:#1A1A1A}
  body{margin:0;background:#1A1A1A;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  .gc-main-content>.container{width:auto!important;max-width:none!important;padding:0!important}

  .ds{
    /* Палитра — с нашего сайта; шрифты — как на страницах предзаписи и лид-магнита */
    --esp:#1A1A1A;--g:#6B3FA0;--g-dark:#3E2468;--sand:#C9A6E8;
    --hair-dark:rgba(201,166,232,.2);
    --glow:radial-gradient(60% 50% at 50% 0%,rgba(107,63,160,.42),rgba(107,63,160,0) 100%);
    --display:"Tenor Sans",Georgia,serif;
    --text:"Graphik LCG","GraphikLCG","Inter",Arial,sans-serif;
    --ease:cubic-bezier(.23,1,.32,1);
    font:400 14px/1.45 var(--text);letter-spacing:-.02em;color:#fff;
  }
  .ds *{box-sizing:border-box}
  .ds p,.ds h1{margin:0;padding:0}

  .ds .ty{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100svh;padding:64px 20px;background:var(--glow),var(--esp);text-align:center}
  .ds .ty-inner{display:flex;flex-direction:column;align-items:center;max-width:640px}
  .ds .ty-eyebrow{font:400 12px/1.4 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--sand)}
  .ds .ty-title{margin-top:20px;font:400 clamp(30px,4.6vw,60px)/1.02 var(--display);text-transform:uppercase;letter-spacing:-.03em;color:var(--sand);text-wrap:balance}
  .ds .ty-title span{display:block}
  .ds .ty-text{max-width:28em;margin-top:24px;font:400 clamp(18px,1.7vw,22px)/1.25 var(--display);letter-spacing:-.03em;color:#fff}
  .ds .ty-text .l{display:block}
  /* На телефоне каждая фраза — ровно одна строка: шрифт подстраивается под ширину экрана */
  @media (max-width:600px){
    .ds .ty-text{max-width:none;font-size:min(4.3vw,18px)}
    .ds .ty-text .l{white-space:nowrap}
    .ds .ty .ty-note{max-width:none;font-size:min(3.9vw,14px);text-wrap:balance}
  }
  .ds .ty-note{max-width:34em;margin-top:16px;font-size:14px;line-height:1.45;color:rgba(255,255,255,.55)}

  .ds .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;min-width:300px;margin-top:40px;padding:0 32px;
    border:1px solid var(--g);border-radius:8px;background:var(--g);color:#fff;
    font:400 15px/1.1 var(--display);letter-spacing:-.02em;cursor:pointer;text-decoration:none;
    transition:background .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease);
  }
  .ds .btn:hover{background:var(--g-dark);border-color:var(--g-dark);transform:translateY(-1px)}
  .ds .btn .arr{width:16px;height:16px;flex:none}
  @media (max-width:480px){.ds .btn{width:100%;min-width:0}}
</style>

<div class="ds">
  <section class="ty">
    <div class="ty-inner">
      <p class="ty-eyebrow">Анкета принята</p>
      <h1 class="ty-title"><span>Ты в списке,</span> <span>остался последний шаг</span></h1>
      <p class="ty-text"><span class="l">не стала откладывать на потом. уважаю.</span> <span class="l">теперь главное — зайди в закрытый канал.</span></p>
      <p class="ty-note">там ссылки на эфиры 15–17 ноября, мои выгрузки, подарки и условия для тех, кто в предзаписи. в открытом доступе этого не будет.</p>
      <!-- ССЫЛКА: заменить # на ссылку закрытого канала -->
      <a class="btn" href="#" target="_blank" rel="noopener">Зайти в закрытый канал
        <svg class="arr" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </section>
</div>
